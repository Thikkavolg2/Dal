<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Physics Cloth Simulation</title>
    <style>
      body {
        margin: 0;
        background: #111;
        overflow: hidden;
        color: #555;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        cursor: crosshair;
      }
      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        pointer-events: none;
      }
      .naman {
        text-align: center;
        color: blanchedalmond;
        font-weight: bold;
        font-size: medium;
      }
    </style>
  </head>
  <body>
    <div class="naman">made with ScriptifyStudio💖</div>
    <div class="info">DRAG to move // RIGHT CLICK to tear</div>
    <canvas id="canvas"></canvas>
    

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let points = [];
      let sticks = [];
      let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, button: 0 };

      const spacing = 20;
      const width = 30;
      const height = 20;
      const bounce = 0.9;
      const gravity = 0.5;
      const friction = 0.99;

      class Point {
        constructor(x, y, pinned = false) {
          this.x = x;
          this.y = y;
          this.oldX = x;
          this.oldY = y;
          this.pinned = pinned;
        }
        update() {
          if (this.pinned) return;
          let vx = (this.x - this.oldX) * friction;
          let vy = (this.y - this.oldY) * friction;
          this.oldX = this.x;
          this.oldY = this.y;
          this.x += vx;
          this.y += vy;
          this.y += gravity;
        }
      }

      class Stick {
        constructor(p1, p2) {
          this.p1 = p1;
          this.p2 = p2;
          this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          this.active = true;
        }
        update() {
          if (!this.active) return;
          let dx = this.p2.x - this.p1.x;
          let dy = this.p2.y - this.p1.y;
          let distance = Math.hypot(dx, dy);
          let difference = this.length - distance;
          let percent = difference / distance / 2;
          let offsetX = dx * percent;
          let offsetY = dy * percent;

          if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
          }
          if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
          }
        }
      }

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        points = [];
        sticks = [];

        for (let y = 0; y <= height; y++) {
          for (let x = 0; x <= width; x++) {
            let p = new Point(x * spacing + 100, y * spacing + 50, y === 0);
            points.push(p);
            if (x > 0) sticks.push(new Stick(points[points.length - 2], p));
            if (y > 0)
              sticks.push(
                new Stick(points[points.length - (width + 1) - 1], p),
              );
          }
        }
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        points.forEach((p) => {
          p.update();
          if (mouse.down) {
            let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (d < 30) {
              if (mouse.button === 2) {
                /* Tearing logic handled in sticks */
              } else {
                p.oldX = p.x - (mouse.x - mouse.px);
                p.oldY = p.y - (mouse.y - mouse.py);
              }
            }
          }
        });

        for (let i = 0; i < 5; i++) {
          // Increase iterations for stiffer cloth
          sticks.forEach((s, idx) => {
            s.update();
            if (mouse.down && mouse.button === 2) {
              let d1 = Math.hypot(s.p1.x - mouse.x, s.p1.y - mouse.y);
              if (d1 < 15) s.active = false;
            }
          });
        }

        ctx.beginPath();
        ctx.strokeStyle = "#00d4ff";
        sticks.forEach((s) => {
          if (!s.active) return;
          ctx.moveTo(s.p1.x, s.p1.y);
          ctx.lineTo(s.p2.x, s.p2.y);
        });
        ctx.stroke();

        mouse.px = mouse.x;
        mouse.py = mouse.y;
        requestAnimationFrame(update);
      }

      canvas.onmousedown = (e) => {
        mouse.down = true;
        mouse.button = e.button;
      };
      canvas.onmouseup = () => {
        mouse.down = false;
      };
      canvas.onmousemove = (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      };
      canvas.oncontextmenu = (e) => e.preventDefault();

      init();
      update();
    </script>
  </body>
</html>
