<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Advanced Cloth Simulation</title>
    <style>
      body {
        margin: 0;
        background: #0f172a; /* Darker modern background */
        overflow: hidden;
        color: #94a3b8;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        touch-action: none; /* Disables browser scrolling on mobile */
      }
      canvas {
        display: block;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .ui-container {
        position: absolute;
        bottom: 30px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 15px;
        pointer-events: none;
        z-index: 10;
      }
      .btn {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      .btn.active {
        background: #00d4ff;
        color: #000;
        box-shadow: 0 0 15px #00d4ff;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .info-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 15px;
        border-radius: 8px;
        border-left: 3px solid #00d4ff;
      }
      .title {
        color: #fff;
        font-size: 1.2rem;
        margin-bottom: 5px;
      }
      .instructions {
        font-size: 0.85rem;
        line-height: 1.4;
      }
      .highlight {
        color: #00d4ff;
      }
    </style>
  </head>
  <body>
    
    <div class="info-panel">
        <div class="title">Cloth Sim V2</div>
        <div class="instructions">
            PC: <span class="highlight">Left Click</span> to Drag, <span class="highlight">Right Click</span> to Tear.<br>
            Mobile: Use buttons below to switch modes.
        </div>
    </div>

    <div class="ui-container">
        <button class="btn active" id="btnDrag" onclick="setMode('drag')">✋ Drag</button>
        <button class="btn" id="btnCut" onclick="setMode('cut')">✂️ Cut</button>
        <button class="btn" onclick="init()">🔄 Reset</button>
    </div>

    <canvas id="canvas"></canvas>
    
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let points = [];
      let sticks = [];
      // Mouse/Touch state
      let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, button: 0 };
      
      // Configuration
      const config = {
          spacing: 18,      // Slightly tighter weave
          width: 45,        // Wider cloth
          height: 25,
          bounce: 0.9,
          gravity: 0.5,
          friction: 0.98,   // Air resistance
          tension: 5,       // Iterations for stiffness
          tearDist: 20,     // Distance to tear
          windStrength: 0.08 // Wind force
      };

      // Current Interaction Mode (drag vs cut)
      let interactionMode = 'drag'; // 'drag' or 'cut'

      class Point {
        constructor(x, y, pinned = false) {
          this.x = x;
          this.y = y;
          this.oldX = x;
          this.oldY = y;
          this.pinned = pinned;
          // Add a little randomness to start to avoid perfect symmetry lock
          this.x += Math.random() * 0.5; 
        }
        update() {
          if (this.pinned) return;
          
          let vx = (this.x - this.oldX) * config.friction;
          let vy = (this.y - this.oldY) * config.friction;

          this.oldX = this.x;
          this.oldY = this.y;
          
          this.x += vx;
          this.y += vy;
          this.y += config.gravity;

          // Add Wind Effect (varies by time and height)
          let time = Date.now() * 0.002;
          let windForce = Math.sin(time + this.y * 0.05) * config.windStrength + Math.sin(time * 0.5) * 0.02;
          this.x += windForce;
        }
      }

      class Stick {
        constructor(p1, p2) {
          this.p1 = p1;
          this.p2 = p2;
          this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          this.active = true;
        }
        update() {
          if (!this.active) return;
          let dx = this.p2.x - this.p1.x;
          let dy = this.p2.y - this.p1.y;
          let distance = Math.hypot(dx, dy);
          let difference = this.length - distance;
          let percent = difference / distance / 2;
          let offsetX = dx * percent;
          let offsetY = dy * percent;

          if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
          }
          if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
          }
        }
      }

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        points = [];
        sticks = [];

        let startX = (canvas.width - (config.width * config.spacing)) / 2;
        let startY = 50;

        for (let y = 0; y <= config.height; y++) {
          for (let x = 0; x <= config.width; x++) {
            // Pin the top row
            let p = new Point(startX + x * config.spacing, startY + y * config.spacing, y === 0);
            points.push(p);
            
            if (x > 0) sticks.push(new Stick(points[points.length - 2], p));
            if (y > 0) sticks.push(new Stick(points[points.length - (config.width + 1) - 1], p));
          }
        }
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Update Points
        points.forEach((p) => {
          p.update();
          
          // Interaction Logic (Mouse/Touch)
          if (mouse.down) {
            let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            
            // Interaction Radius
            if (d < 35) {
              // If Right Click (2) OR Cut Mode is active
              if (mouse.button === 2 || interactionMode === 'cut') {
                  // Tearing is handled in sticks, but we can push points away slightly
              } else {
                // Dragging Logic
                let dragForce = 0.8; // Strength of drag
                let dx = mouse.x - mouse.px;
                let dy = mouse.y - mouse.py;
                
                // If dragging fast, tear it anyway if physics can't keep up (optional realism)
                p.oldX = p.x - dx * dragForce;
                p.oldY = p.y - dy * dragForce;
              }
            }
          }
        });

        // Update Sticks (Constraints)
        for (let i = 0; i < config.tension; i++) {
          sticks.forEach((s) => {
            s.update();
            
            // Tearing Logic
            if (mouse.down && (mouse.button === 2 || interactionMode === 'cut')) {
              let d1 = Math.hypot(s.p1.x - mouse.x, s.p1.y - mouse.y);
              let d2 = Math.hypot(s.p2.x - mouse.x, s.p2.y - mouse.y);
              if (d1 < config.tearDist || d2 < config.tearDist) {
                  s.active = false;
              }
            }
          });
        }

        // Draw Sticks with Gradient Color
        ctx.beginPath();
        
        // Dynamic color based on horizontal position (Rainbow effect)
        // Or simpler: Color based on strain could be calculated but is heavy on performance
        
        sticks.forEach((s) => {
          if (!s.active) return;
          ctx.moveTo(s.p1.x, s.p1.y);
          ctx.lineTo(s.p2.x, s.p2.y);
        });

        // Create a gradient for the stroke
        let gradient
