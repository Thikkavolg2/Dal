<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physics Cloth Mobile Fix</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        overflow: hidden;
        touch-action: none; /* ස්ක්‍රෝල් වීම වැළැක්වීමට */
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .hint {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.4);
        font-family: sans-serif;
        pointer-events: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="hint">Touch and Drag to Move | Swipe fast to Tear</div>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let points = [];
      let sticks = [];
      let mouse = { x: 0, y: 0, px: 0, py: 0, down: false };

      const spacing = 15; // රෙද්දේ ප්‍රමාණය
      const width = 25;   
      const height = 20;
      const gravity = 0.5;
      const friction = 0.98;

      class Point {
        constructor(x, y, pinned = false) {
          this.x = x;
          this.y = y;
          this.oldX = x;
          this.oldY = y;
          this.pinned = pinned;
        }
        update() {
          if (this.pinned) return;
          let vx = (this.x - this.oldX) * friction;
          let vy = (this.y - this.oldY) * friction;
          this.oldX = this.x;
          this.oldY = this.y;
          this.x += vx;
          this.y += vy;
          this.y += gravity;
        }
      }

      class Stick {
        constructor(p1, p2) {
          this.p1 = p1;
          this.p2 = p2;
          this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          this.active = true;
        }
        update() {
          if (!this.active) return;
          let dx = this.p2.x - this.p1.x;
          let dy = this.p2.y - this.p1.y;
          let distance = Math.hypot(dx, dy);
          
          // ඉරී යාමේ පරීක්ෂාව (වැඩිපුර ඇදුනොත් ඉරී යයි)
          if (distance > this.length * 2.5) {
              this.active = false;
          }

          let difference = this.length - distance;
          let percent = difference / distance / 2;
          let offsetX = dx * percent;
          let offsetY = dy * percent;

          if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
          }
          if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
          }
        }
      }

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        points = [];
        sticks = [];

        let offset = (canvas.width - width * spacing) / 2;

        for (let y = 0; y <= height; y++) {
          for (let x = 0; x <= width; x++) {
            let p = new Point(x * spacing + offset, y * spacing + 50, y === 0);
            points.push(p);
            if (x > 0) sticks.push(new Stick(points[points.length - 2], p));
            if (y > 0) sticks.push(new Stick(points[points.length - (width + 1) - 1], p));
          }
        }
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        points.forEach((p) => {
          p.update();
          if (mouse.down) {
            let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (d < 30) {
              p.oldX = p.x - (mouse.x - mouse.px) * 1.5;
              p.oldY = p.y - (mouse.y - mouse.py) * 1.5;
            }
          }
        });

        for (let i = 0; i < 5; i++) {
          sticks.forEach((s) => s.update());
        }

        ctx.beginPath();
        ctx.strokeStyle = "#00d4ff";
        ctx.lineWidth = 1;
        sticks.forEach((s) => {
          if (!s.active) return;
          ctx.moveTo(s.p1.x, s.p1.y);
          ctx.lineTo(s.p2.x, s.p2.y);
        });
        ctx.stroke();

        mouse.px = mouse.x;
        mouse.py = mouse.y;
        requestAnimationFrame(update);
      }

      // ටච් සහ මවුස් පාලක
      function setMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = clientX - rect.left;
        mouse.y = clientY - rect.top;
      }

      canvas.addEventListener("mousedown", (e) => { mouse.down = true; setMouse(e); });
      window.addEventListener("mouseup", () => { mouse.down = false; });
      canvas.addEventListener("mousemove", setMouse);

      canvas.addEventListener("touchstart", (e) => { 
        mouse.down = true; 
        setMouse(e); 
        mouse.px = mouse.x; // පළමු ටච් එකේදී පැනීම වැළැක්වීමට
        mouse.py = mouse.y;
      }, { passive: false });
      
      canvas.addEventListener("touchend", () => { mouse.down = false; });
      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        setMouse(e);
      }, { passive: false });

      window.addEventListener("resize", init);

      init();
      update();
    </script>
  </body>
</html>
