<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bikkuchan Cloth Sim</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        overflow: hidden;
        touch-action: none;
        font-family: 'Segoe UI', sans-serif;
      }
      canvas { display: block; }

      /* Message Overlay */
      #msg-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.95);
        padding: 25px;
        border-radius: 20px;
        text-align: center;
        width: 80%;
        max-width: 400px;
        display: none; /* පස්සේ පේන්න හදන්නේ */
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        z-index: 100;
        border: 4px solid #ff4757;
      }

      #msg-overlay h2 { color: #ff4757; margin-top: 0; }
      #msg-overlay p { font-size: 18px; color: #333; font-weight: bold; line-height: 1.5; }
      
      .btn-reload {
        background: #2ed573;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>

    <div id="msg-overlay">
      <h2>අඩෝ... 😡</h2>
      <p id="funny-text"></p>
      <button class="btn-reload" onclick="location.reload()">හරි හරි හදන්නම් 🥺</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
      // 1. නම අහන වැඩේ
      let userName = prompt("ඔයාගේ නම මොකක්ද?", "");
      if (userName === null || userName.trim() === "") {
        userName = "උබ"; // නමක් නැති අයට
      } else {
        userName = userName.trim();
      }

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const msgOverlay = document.getElementById("msg-overlay");
      const funnyText = document.getElementById("funny-text");

      let points = [];
      let sticks = [];
      let totalSticks = 0;
      let brokenSticks = 0;
      let isGameOver = false;
      let mouse = { x: 0, y: 0, px: 0, py: 0, down: false };

      const spacing = 15;
      const width = 25;   
      const height = 18;
      const gravity = 0.5;
      const friction = 0.98;

      class Point {
        constructor(x, y, pinned = false) {
          this.x = x; this.y = y; this.oldX = x; this.oldY = y; this.pinned = pinned;
        }
        update() {
          if (this.pinned) return;
          let vx = (this.x - this.oldX) * friction;
          let vy = (this.y - this.oldY) * friction;
          this.oldX = this.x; this.oldY = this.y;
          this.x += vx; this.y += vy; this.y += gravity;
        }
      }

      class Stick {
        constructor(p1, p2) {
          this.p1 = p1; this.p2 = p2;
          this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          this.active = true;
        }
        update() {
          if (!this.active) return;
          let dx = this.p2.x - this.p1.x;
          let dy = this.p2.y - this.p1.y;
          let distance = Math.hypot(dx, dy);
          
          if (distance > this.length * 2.5) {
              this.active = false;
              brokenSticks++;
              checkDamage(); // හානිය පරීක්ෂා කරනවා
          }

          let difference = this.length - distance;
          let percent = difference / distance / 2;
          let offsetX = dx * percent; let offsetY = dy * percent;

          if (!this.p1.pinned) { this.p1.x -= offsetX; this.p1.y -= offsetY; }
          if (!this.p2.pinned) { this.p2.x += offsetX; this.p2.y += offsetY; }
        }
      }

      function checkDamage() {
          // දැලෙන් 85% කට වඩා කැඩුනම මැසේජ් එක පෙන්වනවා
          if (!isGameOver && brokenSticks > totalSticks * 0.85) {
              isGameOver = true;
              funnyText.innerText = `${userName} උබ දැල කැඩුවනම් හදල දීපම් නැත්තම් ,මං තොට පොල්ලක් අරන් දෙනව කරටි කැඩෙන්න 🥺😂😂 බික්කුච්චන්`;
              setTimeout(() => {
                msgOverlay.style.display = "block";
              }, 500);
          }
      }

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        points = []; sticks = []; brokenSticks = 0;
        let offset = (canvas.width - width * spacing) / 2;

        for (let y = 0; y <= height; y++) {
          for (let x = 0; x <= width; x++) {
            let p = new Point(x * spacing + offset, y * spacing + 50, y === 0);
            points.push(p);
            if (x > 0) sticks.push(new Stick(points[points.length - 2], p));
            if (y > 0) sticks.push(new Stick(points[points.length - (width + 1) - 1], p));
          }
        }
        totalSticks = sticks.length;
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        points.forEach((p) => {
          p.update();
          if (mouse.down) {
            let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (d < 35) {
              p.oldX = p.x - (mouse.x - mouse.px) * 1.6;
              p.oldY = p.y - (mouse.y - mouse.py) * 1.6;
            }
          }
        });

        for (let i = 0; i < 5; i++) {
          sticks.forEach((s) => s.update());
        }

        ctx.beginPath();
        ctx.strokeStyle = "#00d4ff";
        ctx.lineWidth = 1.5;
        sticks.forEach((s) => {
          if (!s.active) return;
          ctx.moveTo(s.p1.x, s.p1.y);
          ctx.lineTo(s.p2.x, s.p2.y);
        });
        ctx.stroke();

        mouse.px = mouse.x; mouse.py = mouse.y;
        requestAnimationFrame(update);
      }

      function setMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        mouse.px = mouse.x; mouse.py = mouse.y;
        mouse.x = clientX - rect.left; mouse.y = clientY - rect.top;
      }

      canvas.addEventListener("mousedown", (e) => { mouse.down = true; setMouse(e); });
      window.addEventListener("mouseup", () => { mouse.down = false; });
      canvas.addEventListener("mousemove", setMouse);
      canvas.addEventListener("touchstart", (e) => { mouse.down = true; setMouse(e); mouse.px = mouse.x; mouse.py = mouse.y; }, { passive: false });
      canvas.addEventListener("touchend", () => { mouse.down = false; });
      canvas.addEventListener("touchmove", (e) => { e.preventDefault(); setMouse(e); }, { passive: false });

      window.addEventListener("resize", init);
      init();
      update();
    </script>
  </body>
</html>
